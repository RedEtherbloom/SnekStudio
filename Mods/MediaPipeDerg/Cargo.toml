[package]
name = "MediaPipeDerg"
version = "0.1.0"
edition = "2024"
authors = ["Etherbloom <etherbloom@mailbox.org>"]
description = "SnekStudios new GPU accelerated MediaPipe backend. Named Derg as dragons are cool :3(bite me haters)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"] # We build as a godot artifact

[dependencies]
burn = {version = "0.21.0-pre.2", features = ["ndarray"], default-features = false} # TODO: Figure out proper accelerated setup
burn-vision = "0.21.0-pre.2" 
burn-store = {version = "0.21.0-pre.2", features = ["std", "burnpack"]}
godot= {version = "0.4.5"}
image = "0.25.10"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = {version = "2.0.18"}

[dev-dependencies]
test-log = { version = "0.2.19", features = ["trace"]}

[build-dependencies]
burn-onnx = { git = "https://github.com/tracel-ai/burn-onnx" }
